<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chilton Place Walkthrough</title>
<meta name="description" content="Interactive 3D walkthrough captured by VYRA.">
<link rel="icon" href="brand-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #151618;
  --panel: rgba(24, 25, 28, .78);
  --panel-solid: #1c1d20;
  --ink: #f4ecd9;
  --dim: #cdc5b3;
  --muted: #a9a59c;
  --gold: #d9b871;
  --gold-hi: #e8d09a;
  --on-gold: #151618;
  --line: rgba(233, 213, 161, .18);
  --shadow: 0 14px 40px rgba(0, 0, 0, .45);
  --font: "Satoshi", "Manrope", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
/* the viewer is a photo stage: same dark chrome in both themes */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151618; } }
:root[data-theme="dark"] { --bg: #151618; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage.pointing { cursor: pointer; }
canvas { display: block; }

.glass { background: var(--panel); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line); box-shadow: var(--shadow); }

/* brand / title */
#brand { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 16px; z-index: 5; max-width: calc(100vw - 32px - 120px); }
#brand img { width: 38px; height: 38px; border-radius: 10px; flex: none; }
#brand .t { min-width: 0; }
#brand .name { font-weight: 700; font-size: 15px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#brand .sub { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#tools { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 16px; display: flex; gap: 8px; z-index: 5; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .2s var(--ease); }
.icon-btn:hover { background: rgba(40, 41, 46, .9); }
.icon-btn:active { transform: scale(.95); }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* room chip */
#room { position: fixed; top: max(76px, calc(env(safe-area-inset-top) + 62px)); left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; letter-spacing: .02em; z-index: 4; white-space: nowrap; transition: opacity .35s; }
#room b { color: var(--gold); font-weight: 700; margin-right: 6px; }

/* bottom dock */
#dock { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 18px; z-index: 5; }
.seg { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border: 0; background: transparent; border-radius: 13px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--dim); transition: background .2s, color .2s; white-space: nowrap; }
.seg svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.seg:hover { color: var(--ink); background: rgba(255, 255, 255, .05); }
.seg[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); }
.seg.play[aria-pressed="true"] { background: var(--gold-hi); }

/* level switch */
#levels { position: fixed; right: 16px; bottom: max(84px, calc(env(safe-area-inset-bottom) + 70px)); display: none; flex-direction: column; gap: 4px; padding: 5px; border-radius: 16px; z-index: 5; }
#levels.show { display: flex; }
#levels .seg { padding: 9px 14px; font-size: 13px; }

/* minimap */
#mini { position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 230px; height: 170px; border-radius: 16px; overflow: hidden; z-index: 4; cursor: pointer; transition: opacity .3s, transform .3s var(--ease); }
#mini canvas { width: 100%; height: 100%; }
#mini .cap { position: absolute; left: 10px; right: 10px; top: 8px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mini::after { content: "Tap for floor plan"; position: absolute; right: 10px; bottom: 7px; font-size: 9.5px; color: var(--muted); letter-spacing: .04em; pointer-events: none; }
#mini { background: rgba(18,19,21,.86); }
#mini:hover { transform: translateY(-2px); }

/* floor plan overlay */
#plan { position: fixed; inset: 0; z-index: 3; display: none; background: radial-gradient(ellipse at center, #1d1e22 0%, #121315 75%); }
#plan.show { display: block; animation: fade .35s var(--ease); }
#plan canvas { width: 100%; height: 100%; cursor: pointer; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* intro card */
#intro { position: fixed; inset: 0; z-index: 6; display: grid; place-items: end center; padding: 24px 16px max(28px, env(safe-area-inset-bottom)); pointer-events: none; background: linear-gradient(180deg, rgba(21,22,24,0) 45%, rgba(21,22,24,.75) 100%); transition: opacity .6s; }
#intro.hide { opacity: 0; }
#intro .card { pointer-events: auto; text-align: center; padding: 26px 28px 24px; border-radius: 22px; max-width: 440px; width: 100%; }
#intro .eyebrow { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
#intro h1 { margin: 10px 0 6px; font-size: clamp(26px, 5vw, 34px); line-height: 1.1; letter-spacing: -.01em; }
#intro p { margin: 0 0 18px; color: var(--dim); font-size: 14px; line-height: 1.5; }
.cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 14px; border: 0; background: var(--gold); color: var(--on-gold); font-weight: 700; font-size: 15px; cursor: pointer; transition: transform .2s var(--ease), background .2s; }
.cta:hover { background: var(--gold-hi); transform: translateY(-1px); }
.cta svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cta.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-left: 6px; }
.cta.ghost:hover { background: rgba(255,255,255,.06); }

/* measure */
#stage.measuring { cursor: crosshair; }
#mbar { position: fixed; top: max(118px, calc(env(safe-area-inset-top) + 104px)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 14px; z-index: 5; font-size: 13px; color: var(--dim); white-space: nowrap; }
#mbar[hidden] { display: none; }
#mbar b { color: var(--gold); }
.mbtn { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.mbtn.gold { background: var(--gold); color: var(--on-gold); border-color: transparent; }
#mlabels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.mlabel { position: absolute; left: 0; top: 0; padding: 5px 10px; border-radius: 9px; background: rgba(21,22,24,.85); color: var(--gold-hi); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; border: 1px solid rgba(217,184,113,.45); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
/* hint + toast */
#hint { position: fixed; left: 50%; bottom: max(86px, calc(env(safe-area-inset-bottom) + 72px)); transform: translateX(-50%); padding: 10px 16px; border-radius: 14px; font-size: 13px; color: var(--dim); z-index: 4; white-space: nowrap; transition: opacity .6s; pointer-events: none; }
#hint b { color: var(--ink); font-weight: 500; }
#toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 18px; border-radius: 14px; font-size: 14px; z-index: 9; opacity: 0; transition: opacity .3s; pointer-events: none; }

/* loader */
#loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--bg); transition: opacity .6s; }
#loader.hide { opacity: 0; pointer-events: none; }
#loader .in { text-align: center; }
#loader img { width: 64px; height: 64px; border-radius: 16px; animation: pulse 1.6s ease-in-out infinite; }
#loader .bar { width: 160px; height: 3px; background: rgba(255,255,255,.08); border-radius: 3px; margin: 18px auto 0; overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
@keyframes pulse { 50% { transform: scale(.94); opacity: .75; } }

#credit { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 4; font-size: 11px; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 10px; letter-spacing: .04em; }
#credit b { color: var(--gold); font-weight: 700; letter-spacing: .12em; }

/* phone layout */
@media (max-width: 720px) {
  .seg span { display: none; }
  .seg { padding: 11px 14px; }
  #mini { width: 150px; height: 118px; bottom: max(84px, calc(env(safe-area-inset-bottom) + 70px)); }
  #mini::after { display: none; }
  #credit { display: none; }
  #brand .name { font-size: 14px; }
  #brand .sub { font-size: 9.5px; letter-spacing: .14em; }
  #hint { white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 32px); bottom: max(196px, calc(env(safe-area-inset-bottom) + 182px)); }
  #room { top: max(72px, calc(env(safe-area-inset-top) + 60px)); }
  #mbar { top: max(112px, calc(env(safe-area-inset-top) + 100px)); padding-left: 12px; }
  #mbar span { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
// VYRA 3D walkthrough viewer
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

THREE.ColorManagement.enabled = false;
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const smooth = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const yawTo = (a, b) => Math.atan2(-(b.x - a.x), -(b.z - a.z));
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const isTouch = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const params = new URLSearchParams(location.search);
const hashM = location.hash.match(/^#p(\d+)-h(\d+)$/);
const FONT = (getComputedStyle(document.documentElement).getPropertyValue('--font') || 'Helvetica, Arial, sans-serif').trim();
const framed = (() => { try { return window.self !== window.top; } catch { return true; } })();
if (framed) document.getElementById('btnShare').style.display = 'none';
const loaderBar = $('#loader .bar i');
const setLoad = (f) => { loaderBar.style.width = Math.round(f * 100) + '%'; };

// ------------------------------------------------------------------ data
const tour = await (await fetch('tour.json')).json();
setLoad(.15);
async function fetchB64(url) {
  const txt = await (await fetch(url)).text();
  const bin = atob(txt.trim()); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
const depthBuf = new Uint16Array(await fetchB64('depth.txt'));
setLoad(.3);
const S = tour.sweeps;
S.forEach((s) => { s.v = new THREE.Vector3(...s.p); s.fl = new THREE.Vector3(s.p[0], s.p[1] + s.f, s.p[2]); });
const levelOf = (n) => S[n].level;
document.title = "Chilton Place Walkthrough";
$('#title').textContent = tour.title;
$('#subtitle').textContent = tour.subtitle || '3D walkthrough';
$('#introTitle').textContent = tour.title;

// ------------------------------------------------------------------ renderer
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // shaders pass sRGB through untouched
stage.appendChild(renderer.domElement);
const maxTex = renderer.capabilities.maxCubemapSize || 4096;
const big = Math.max(innerWidth, innerHeight) * Math.min(devicePixelRatio, 2);
const HI = (!isTouch && big > 1500 && maxTex >= 2048) ? 2048 : 1024;

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 400);
camera.rotation.order = 'YXZ';
let yaw = 0, pitch = -0.05, fov = isTouch ? 80 : 75;

// ------------------------------------------------------------------ pano meshes
const DW = tour.depth.w, DH = tour.depth.h;
const geoCache = new Map();
function depthGeo(n) {
  if (geoCache.has(n)) return geoCache.get(n);
  const off = n * DW * DH;
  const d = (x, y) => depthBuf[off + clamp(y, 0, DH - 1) * DW + ((x % DW) + DW) % DW] / 1000;
  const pos = new Float32Array((DW + 1) * (DH + 1) * 3);
  const idx = [];
  let k = 0;
  for (let j = 0; j <= DH; j++) {
    const lat = (0.5 - j / DH) * Math.PI;
    let rowAvg = 0;
    if (j === 0 || j === DH) { for (let x = 0; x < DW; x++) rowAvg += d(x, j === 0 ? 0 : DH - 1); rowAvg /= DW; }
    for (let i = 0; i <= DW; i++) {
      const lon = (i / DW - 0.5) * Math.PI * 2;
      const r = (j === 0 || j === DH) ? rowAvg
        : (d(i - 1, j - 1) + d(i, j - 1) + d(i - 1, j) + d(i, j)) / 4;
      const cl = Math.cos(lat);
      pos[k++] = cl * Math.cos(lon) * r; pos[k++] = Math.sin(lat) * r; pos[k++] = cl * Math.sin(lon) * r;
    }
  }
  for (let j = 0; j < DH; j++) for (let i = 0; i < DW; i++) {
    const a = j * (DW + 1) + i, b = a + 1, c = a + DW + 1, e = c + 1;
    idx.push(a, c, b, b, c, e);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  geoCache.set(n, g);
  return g;
}

const panoVert = `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const panoFrag = `uniform samplerCube map; uniform vec3 center; uniform float opacity; uniform float gain; uniform float outdoor; varying vec3 vW;
void main(){ vec3 d = normalize(vW - center); vec3 c = textureCube(map, d).rgb;
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), opacity); }`;
function panoMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: null }, center: { value: new THREE.Vector3() }, opacity: { value: 1 }, gain: { value: 1 }, outdoor: { value: 0 } },
    vertexShader: panoVert, fragmentShader: panoFrag, side: THREE.DoubleSide, transparent: true, depthWrite: true, depthTest: true,
  });
}
const sceneA = new THREE.Scene(), sceneB = new THREE.Scene(), sceneUI = new THREE.Scene();
const meshA = new THREE.Mesh(new THREE.BufferGeometry(), panoMaterial());
const meshB = new THREE.Mesh(new THREE.BufferGeometry(), panoMaterial());
sceneA.add(meshA); sceneB.add(meshB);
function setPano(mesh, n, tex) {
  mesh.geometry = depthGeo(n);
  mesh.position.copy(S[n].v);
  mesh.material.uniforms.center.value.copy(S[n].v);
  mesh.material.uniforms.map.value = tex;
  mesh.material.uniforms.gain.value = S[n].gain || 1;
  mesh.material.uniforms.outdoor.value = S[n].out ? 1 : 0;
  mesh.userData.n = n;
  mesh.updateMatrixWorld();
}

// ------------------------------------------------------------------ textures
const texCache = new Map(); // key `${n}_${size}` -> {tex, p}
const FACES = ['px', 'nx', 'py', 'ny', 'pz', 'nz'];
function loadCube(n, size) {
  const key = `${n}_${size}`;
  if (texCache.has(key)) return texCache.get(key).p;
  const ent = { tex: null, used: performance.now() };
  // each pano ships as one vertical strip of 6 faces (px,nx,py,ny,pz,nz)
  ent.p = (async () => {
    const r = await fetch(`strips/${n}_${size}.jpg`);
    if (!r.ok) throw new Error('pano ' + key);
    const blob = await r.blob();
    let faces;
    if (window.createImageBitmap) {
      const full = await createImageBitmap(blob);
      faces = await Promise.all(FACES.map((_, k) => createImageBitmap(full, 0, k * size, size, size)));
      full.close && full.close();
    } else {
      const img = new Image(); img.src = URL.createObjectURL(blob); await img.decode();
      faces = FACES.map((_, k) => { const c = document.createElement('canvas'); c.width = c.height = size; c.getContext('2d').drawImage(img, 0, k * size, size, size, 0, 0, size, size); return c; });
    }

function stopAuto(resetIcon = true) { if (auto) { auto.stop = true; auto = null; } setPlayIcon(false); }
async function startAuto() {

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
playBtn.addEventListener('click', () => { if (auto) stopAuto(); else startAuto(); });

// ------------------------------------------------------------------ chrome
$('#btnFull').addEventListener('click', () => {
  const el = document.documentElement;

});
function writeURL() {

  const h = Math.round((((yaw % 6.2832) + 6.2832) % 6.2832) * 100);

}
$('#btnShare').addEventListener('click', async () => {
  writeURL();
  try { await navigator.clipboard.writeText(location.href); toast('Link to this view copied'); } catch { toast('Copy the address bar to share this view'); }

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.opacity = 0), 1800); }
let hinted = false;
function showHint() {

}

addEventListener('resize', () => {
  modelUniforms.scale.value = innerHeight / 2;
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = camM.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); camM.updateProjectionMatrix();
  if (mode === 'plan') drawPlan(); drawMini();
});

// ------------------------------------------------------------------ loop
function frame(now) {
  requestAnimationFrame(frame);
  renderer.clear();
  if (mode === 'walk' || mode === 'plan') {
    if (trans) stepTransition(now);
    else if (!drag && (Math.abs(velYaw) > 1e-4 || Math.abs(velPitch) > 1e-4)) { yaw += velYaw; pitch = clamp(pitch + velPitch, -1.45, 1.45); velYaw *= .9; velPitch *= .9; }

    camera.rotation.set(pitch, yaw, 0);
    if (mode === 'walk') {
      if (meshA.material.uniforms.map.value) renderer.render(sceneA, camera);
      if (trans) { renderer.clearDepth(); renderer.render(sceneB, camera); }
      renderer.clearDepth(); renderer.render(sceneUI, camera);
      if (now - lastMini > 120) drawMini();
      if (measures.length) placeMeasureLabels();

  } else {
    if (fly) stepFly(now);
    else if (orbit) {
      if (autoSpin && mode === 'intro') { const a = 0.0011; const p = camM.position.clone().sub(orbit.target); p.applyAxisAngle(new THREE.Vector3(0, 1, 0), a); camM.position.copy(orbit.target).add(p); }
      orbit.update();

    if (orbit) { const dd = camM.position.distanceTo(orbit.target); modelUniforms.fogA.value = dd - 4; modelUniforms.fogB.value = dd + 14; }

}

// ------------------------------------------------------------------ boot
const deep = hashM || params.has('s');
const startN = hashM ? clamp(+hashM[1], 0, S.length - 1) : params.has('s') ? clamp(parseInt(params.get('s'), 10) || 0, 0, S.length - 1) : tour.start;
const startYaw = hashM ? +hashM[2] / 100 : params.has('h') ? parseFloat(params.get('h')) : (tour.startYaw ?? 0);
cur = startN; yaw = startYaw;
loadCube(startN, 512).catch(() => {});
requestAnimationFrame(frame);
const hideLoader = () => { setLoad(1); setTimeout(() => $('#loader').classList.add('hide'), 250); };

if (deep || params.get('view') === 'walk') {
  await loadCube(startN, 512).catch(() => {});
  hideLoader();
  setMode('walk', { n: startN, yaw: startYaw });
} else {
  // intro: the whole home as a slowly turning 3D model
  try { await loadModel(); } catch (e) { console.warn(e); }
  setLoad(.9);
  mode = 'intro';
  miniEl.style.display = 'none';
  $('#dock').style.display = 'none';
  const intro = $('#intro'); intro.style.display = 'grid';
  hideLoader();
  const go = (withTour) => {
    intro.classList.add('hide'); setTimeout(() => (intro.style.display = 'none'), 600);
    $('#dock').style.display = '';
    if (orbit) flyInto(tour.start, tour.startYaw ?? 0); else setMode('walk', { n: tour.start, yaw: tour.startYaw ?? 0 });
    if (withTour) { const w = setInterval(() => { if (mode === 'walk' && !trans && !fly) { clearInterval(w); startAuto(); } }, 200); }
  };
  $('#btnStart').addEventListener('click', () => go(false));
  $('#btnIntroTour').addEventListener('click', () => go(true));
}

// debug / automation hook (harmless in production)
window.__tour = { goTo, setMode, S, get cur() { return cur; }, get yaw() { return yaw; }, set yaw(v) { yaw = v; }, get mode() { return mode; }, flyInto, startAuto, stopAuto, get camM() { return camM; }, get orbit() { return orbit; }, get pts() { return modelPts; }, setMeasuring, measureClickAt: (x, y) => { setNDC(x, y); measureClick(); }, get measures() { return measures.map((m) => m.a.distanceTo(m.b)); } };
