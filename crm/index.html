<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#151618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VYRA CRM">
<title>VYRA CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../assets/brand-mark.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>
<header class="top">
  <h1 id="title">Today</h1>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today" class="on"><span>☀︎</span>Today</button>
  <button data-tab="contacts"><span>☰</span>Agents</button>
  <button data-tab="pipeline"><span>▤</span>Pipeline</button>
  <button data-tab="jobs"><span>⌂</span>Jobs</button>
  <button data-tab="stats"><span>◔</span>Stats</button>
</nav>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=1"></script>
</body>
</html>
